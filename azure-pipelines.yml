# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- develop

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'camdevcr-Container-registry'
  imageRepository: 'camsoftrdjobform'
  containerRegistry: 'camdevcr.azurecr.io'
  containerAppName: 'triple-dev-jobs'
  resourceGroup: 'Triple-Dev-RG'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  OPENAI_API_KEY: $(OPENAI_API_KEY)

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Triple Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
           az containerapp update \
            --name $(containerAppName) \
            --resource-group $(resourceGroup) \
            --image $(containerRegistry)/$(imageRepository):$(Build.BuildId) 
            #--set-env-vars OPENAI_API_KEY=$(OPENAI_API_KEY)
