[client]
toolbarMode = "viewer" #Con esta configuración, la opción de "Deploy" no debería aparecer en la interfaz de tu aplicación.



[server]
maxUploadSize = 20
enableCORS = false
enableXsrfProtection = false
headless = true
port = 8501



[theme]

# The preset Streamlit theme that your custom theme inherits from.
# This can be one of the following: "light" or "dark".
base = "light"

# Primary accent color.
primaryColor = "#0077B5"  # Aldaba Red

# Background color of the app.
backgroundColor = "#FFFFFF"  # White

# Background color used for most interactive widgets.
secondaryBackgroundColor = "#F8F8F8"  # Very light gray

# Color used for almost all text.
textColor = "#333333"  # Dark Gray

# Font family
font = "sans serif"
